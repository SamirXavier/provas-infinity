<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Tarefas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    #container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Flex container para input + botão */
    #inputContainer {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      padding: 10px;
      margin-bottom: 10px;
      background: #e3e3e3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 5px;
    }

    li.concluida {
      text-decoration: line-through;
      color: gray;
    }

    .remover {
      background-color: #f44336;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Organizador de Tarefas</h1>

  <div id="container">
    <div id="inputContainer">
      <input type="text" id="tarefaInput" placeholder="Digite uma tarefa">
      <button id="adicionarBtn">Adicionar Tarefa</button>
    </div>

    <ul id="listaTarefas"></ul>
  </div>

  <script>
    const tarefaInput = document.getElementById('tarefaInput');
    const adicionarBtn = document.getElementById('adicionarBtn');
    const listaTarefas = document.getElementById('listaTarefas');

    // Função para adicionar tarefa
    function adicionarTarefa() {
      const textoTarefa = tarefaInput.value.trim();
      if (textoTarefa === '') {
        alert('Digite uma tarefa!');
        return;
      }

      const li = document.createElement('li');

      const spanTarefa = document.createElement('span');
      spanTarefa.textContent = textoTarefa;

      // Marcar como concluída ao clicar
      spanTarefa.addEventListener('click', () => {
        li.classList.toggle('concluida');
      });

      const removerBtn = document.createElement('button');
      removerBtn.textContent = 'Remover';
      removerBtn.classList.add('remover');

      removerBtn.addEventListener('click', () => {
        listaTarefas.removeChild(li);
      });

      li.appendChild(spanTarefa);
      li.appendChild(removerBtn);

      listaTarefas.appendChild(li);

      tarefaInput.value = '';
      tarefaInput.focus();
    }

    adicionarBtn.addEventListener('click', adicionarTarefa);

    tarefaInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        adicionarTarefa();
      }
    });
  </script>
</body>

</html>
