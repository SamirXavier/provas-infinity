<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Interativo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        #container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .botoes {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.3s;
            color: white;
        }

        #enviarBtn {
            background-color: #4CAF50;
        }

        #enviarBtn:hover {
            background-color: #45a049;
        }

        #limparBtn {
            background-color: #f44336;
        }

        #limparBtn:hover {
            background-color: #da2c2c;
        }

        ul {
            margin-top: 25px;
            padding-left: 20px;
        }

        li {
            background: #f0f0f0;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Formulário Interativo</h1>

    <div id="container">
        <form id="meuFormulario">
            <input type="text" id="nome" placeholder="Nome de usuário">
            <input type="password" id="senha" placeholder="Senha">
            <input type="tel" id="telefone" placeholder="Telefone">
            <input type="date" id="nascimento" placeholder="Data de Nascimento">
            <input type="email" id="email" placeholder="E-mail">

            <div class="botoes">
                <button type="submit" id="enviarBtn">Enviar</button>
                <button type="button" id="limparBtn">Limpar Lista</button>
            </div>
        </form>

        <ul id="listaInformacoes"></ul>
    </div>

    <script>
        const formulario = document.getElementById("meuFormulario");
        const listaInformacoes = document.getElementById("listaInformacoes");
        const limparBtn = document.getElementById("limparBtn");

        formulario.addEventListener("submit", function (event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const senha = document.getElementById("senha").value.trim();
            const telefone = document.getElementById("telefone").value.trim();
            const nascimento = document.getElementById("nascimento").value.trim();
            const email = document.getElementById("email").value.trim();

            if (!nome || !senha || !telefone || !nascimento || !email) {
                console.error("Todos os campos devem ser preenchidos!");
                return;
            }

            const li = document.createElement("li");
            li.textContent = `Nome: ${nome}, Senha: ${senha}, Telefone: ${telefone}, Nascimento: ${nascimento}, E-mail: ${email}`;

            listaInformacoes.appendChild(li);

            formulario.reset();
        });

        limparBtn.addEventListener("click", function () {
            listaInformacoes.innerHTML = "";
        });
    </script>

</body>

</html>
