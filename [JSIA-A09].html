<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    
    <script>
        // ===============================
        // Sistema simples de notas escolares
        // ===============================

        // Declaração do objeto aluno
        const aluno = {
            nome: "Carlos Henrique",
            idade: 17,
            notas: [8, 7, 6],

            // Método para calcular a média
            calcularMedia() {
                const soma = this.notas.reduce((total, nota) => total + nota, 0);
                return soma / this.notas.length;
            }
        };

        // --- Desestruturação ---
        // Pegando nome e idade do aluno
        const { nome, idade } = aluno;

        // --- Spread Operator ---
        // Adicionando nova nota sem alterar o array original diretamente
        const novasNotas = [...aluno.notas, 9];

        // Atualizando as notas do aluno com o novo array
        aluno.notas = novasNotas;

        // --- Função para verificar situação ---
        function verificarSituacao(media) {
            if (media >= 7) {
                return "Aprovado 🎉";
            } else {
                return "Reprovado ❌";
            }
        }

        // --- Exibindo todas as notas com loop ---
        console.log("=== Notas do aluno ===");
        for (let i = 0; i < aluno.notas.length; i++) {
            console.log(`Nota ${i + 1}: ${aluno.notas[i]}`);
        }

        // --- Cálculo da média e situação ---
        const mediaFinal = aluno.calcularMedia();
        const situacao = verificarSituacao(mediaFinal);

        // --- Exibindo os resultados finais ---
        console.log("\n=== Resultado Final ===");
        console.log(`Nome: ${nome}`);
        console.log(`Idade: ${idade} anos`);
        console.log(`Média final: ${mediaFinal.toFixed(2)}`);
        console.log(`Situação: ${situacao}`);

    </script>
</body>

</html>
